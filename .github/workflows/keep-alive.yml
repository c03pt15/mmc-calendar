name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run keep-alive script
        run: node scripts/keep-alive.js
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Keep repo active
        run: |
          echo "Last kept alive: $(date -u)" > .github/keep-alive.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/keep-alive.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: keep repo active [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
